# PayStar Market — merge-blocking gates.
#
# This file contains NO check logic, by design. Every gate is a standalone script
# that a developer runs by hand with the identical command (see README.md,
# "Running the checks locally"). If a rule needs to change, it changes in
# `tools/*.php` or `deptrac.yaml` — never here — so the pipeline and a laptop can
# never disagree about what the rules are.
#
# All four jobs are required: a failure blocks the merge.

stages:
  - guards
  - test

default:
  # composer.lock needs only extensions the official image already bundles
  # (ctype dom fileinfo filter hash iconv json libxml mbstring openssl pcre phar
  # session tokenizer xml xmlwriter). `zip` is added so Composer installs from
  # dist without shelling out. Later stories add what they need — pdo_pgsql for
  # Story 1.3, redis for the queue work — as they need it, not before.
  image: php:8.4-cli
  before_script:
    - apt-get update -yqq && apt-get install -yqq git unzip libzip-dev
    - docker-php-ext-install zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress --prefer-dist
  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/

module-boundaries:
  stage: guards
  script:
    - vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress

schema-guard:
  stage: guards
  script:
    - php tools/schema-guard.php

migration-guard:
  stage: guards
  script:
    - php tools/migration-guard.php

test:
  stage: test
  script:
    - php artisan test
