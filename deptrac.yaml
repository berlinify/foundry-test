# Module boundary enforcement — TAD §4.1, rules 1-5.
#
# Generated shape, hand-maintained from here on:
#   * `Platform` is a single layer — the whole module is public to every other module.
#   * Every other module contributes TWO layers:
#       `<Module>.Contracts` — the public API (interfaces + DTOs), importable by anyone;
#       `<Module>`           — everything else (Domain, Application, Infrastructure,
#                              Http, Console, Listeners, Database, Tests): internal.
#   * `App` is the Laravel host application. It may reach contracts, never internals,
#     and no module may reach back into it.
#
# Adding a module means adding its two layers AND its ruleset entry AND adding its
# `.Contracts` layer to every other ruleset. Run `composer guard:boundaries` after.

deptrac:
  paths:
    - ./app

  layers:
    - name: Platform
      collectors:
        - type: classLike
          value: '^Modules\\Platform\\'

    - name: Identity.Contracts
      collectors:
        - type: classLike
          value: '^Modules\\Identity\\Contracts\\'

    - name: Identity
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Identity\\'
          must_not:
            - type: classLike
              value: '^Modules\\Identity\\Contracts\\'

    - name: Tenancy.Contracts
      collectors:
        - type: classLike
          value: '^Modules\\Tenancy\\Contracts\\'

    - name: Tenancy
